[project]
name = "mdenseon-mlateon-training"
version = "0.1.0"
description = "Training scripts for the mDenseOn and mLateOn retrieval models"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "LightOn" },
]
dependencies = [
  "accelerate>=1.4,<2",
  "datasets>=3.3,<4",
  "huggingface-hub>=0.28,<2",
  "numpy>=1.26,<3",
  "pyarrow>=16,<24",
  "pylate>=1.6,<2",
  "sentence-transformers>=5,<6",
  "torch>=2.5,<3",
  "tqdm>=4.67,<5",
  "transformers>=5,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.urls]
Article = "https://huggingface.co/blog/lightonai/mdenseon-mlateon"
Models = "https://huggingface.co/collections/lightonai/denseon-and-lateon"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
