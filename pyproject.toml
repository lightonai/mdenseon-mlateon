[project]
name = "mdenseon-mlateon-train-eval"
version = "0.1.0"
description = "Training and eval scripts for the mDenseOn and mLateOn retrieval models"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "LightOn" },
]
dependencies = [
  "accelerate>=1.4,<2",
  "datasets>=3.3,<4",
  "huggingface-hub>=0.28,<2",
  "numpy>=1.26,<3",
  "pyarrow>=16,<24",
  "pylate>=1.6,<2",
  "sentence-transformers>=5.3,<5.4",
  "torch>=2.5,<3",
  "tqdm>=4.67,<5",
  "transformers>=5,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]
eval = [
  "fast-plaid>=1.5.1,<2",
  "mteb>=2.18,<3",
]
flash = [
  "flash-attn>=2.8,<3",
]

[project.urls]
Paper = "https://arxiv.org/abs/2607.27178"
Article = "https://huggingface.co/blog/lightonai/mdenseon-mlateon"
Models = "https://huggingface.co/collections/lightonai/denseon-and-lateon"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.uv]
# flash-attn compiles against the installed torch, so it cannot build in an isolated env.
no-build-isolation-package = ["flash-attn"]
# pylate 1.6.0 caps fast-plaid at 1.4.6.x but the eval scripts need the 1.5 API; they coexist fine.
override-dependencies = ["fast-plaid>=1.5.1,<2"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
